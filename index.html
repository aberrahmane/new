    content:`<p>Smoking's damage to the heart, lungs, and blood vessels is well documented — but its effects reach further than most people expect, including the scalp and hair follicles.</p>
<h3>How smoking affects hair</h3>

<li>Several studies have found an association between chronic smoking and more severe androgenetic (pattern) hair loss in people already genetically predisposed to it.</li>
<li>It can also affect scalp healing and the overall strength and shine of hair over time.</li></ul>

    summary:"Iron deficiency is one of the most common — and most treatable — causes of non-genetic hair thinning. Here's how the two connect.",
    summaryAr:'كيف يرتبط نقص الحديد والفيريتين بتساقط الشعر، وأهمية الأخذ بالأسباب في طلب العلاج.',
    content:`<p>Iron deficiency is one of the most common, and most reversible, causes of hair shedding that isn't related to genetics. It can show up before full-blown anemia does, which is why doctors often check ferritin — the body's iron-storage marker — even when hemoglobin still looks normal.</p>
<h3>The link between iron and hair</h3>
<p>Hair follicles are metabolically active tissue, and low iron stores can push more follicles into the resting (telogen) phase earlier than usual. This tends to show up as diffuse thinning rather than a defined bald patch.</p>
<ul><li>Iron-deficiency anemia is especially common in women, particularly during heavy periods, pregnancy, and the postpartum period.</li>
<li>Correcting low ferritin can help reduce shedding in people who are deficient, though the relationship isn't the same for everyone.</li>
<li>Both markers are simple to check with a standard blood test — you can log your own results in this app's Lab Test section.</li></ul>
<h3>What to do next</h3>
<p>If you're noticing unexplained shedding, ask your doctor for a full panel including iron, ferritin, and hemoglobin. A proper diagnosis is the foundation of any treatment plan.</p>`,
    contentAr:`<p>حثّ ديننا الحنيف على الأخذ بالأسباب مع التوكل على الله، وهذا أصل عظيم يدفعنا للبحث عن أسباب مشكلاتنا الصحية، ومنها تساقط الشعر، بدل الاستسلام للقلق دون علم.</p>
<h3>العلاقة بين فقر الدم وتساقط الشعر</h3>
<p>من الأسباب الشائعة والقابلة للعلاج لتساقط الشعر غير الوراثي نقصُ الحديد، سواء وصل إلى درجة فقر الدم أو بقي في مرحلة نقص الفيريتين قبل ظهوره. ترتبط مستوياته المنخفضة بدخول بصيلات الشعر في طور السكون مبكرًا، ما يؤدي إلى تساقط منتشر وملحوظ.</p>

    title:'How Vitamin D and Thyroid Hormone (TSH) Affect Hair Health',
    titleAr:'تأثير فيتامين د وهرمون الغدة الدرقية (TSH) على صحة الشعر',
    summary:'A plain-language look at how vitamin D and thyroid function influence the hair growth cycle.',
    summaryAr:'نظرة طبية مبسطة على دور فيتامين د والغدة الدرقية في دورة نمو الشعر.',
    content:`<p>Hair follicles are surprisingly sensitive to what's happening in the rest of the body — including hormone levels that have nothing to do with hair directly, like vitamin D and thyroid-stimulating hormone (TSH).</p>
<h3>Vitamin D and hair growth</h3>
<p>Vitamin D appears to play a role in activating new hair follicles and supporting the normal growth cycle. Some studies have found a link between low vitamin D levels and certain types of hair loss — though this research is still evolving.</p>
<h3>TSH and the thyroid</h3>
<p>TSH is the main marker doctors use to check how well the thyroid is functioning. Both an underactive thyroid (high TSH) and an overactive one (low TSH) can cause diffuse hair thinning.</p>
<ul><li>Hair loss caused by a thyroid imbalance often improves significantly once hormone levels are corrected under a doctor's care.</li>
<li>TSH is a reasonable marker to ask for whenever hair loss is unexplained — especially alongside fatigue or unexpected weight change.</li>
<li>You can log these results over time using this app's Lab Test feature.</li></ul>
<h3>Takeaway</h3>
<p>If you notice an unusual change in your hair, it's worth checking these markers with a doctor rather than guessing.</p>`,

<h3>فيتامين د ودوره في نمو الشعر</h3>
<p>يلعب فيتامين د دورًا في تنشيط بصيلات الشعر الجديدة والحفاظ على دورة نموها الطبيعية. وقد أظهرت بعض الأبحاث ارتباطًا بين انخفاض مستوياته وبعض أنواع تساقط الشعر.</p>
<h3>هرمون TSH والغدة الدرقية</h3>
<p>هرمون TSH هو المؤشر الأساسي الذي يستخدمه الأطباء لتقييم عمل الغدة الدرقية. فكل من قصورها وفرط نشاطها قد يؤديان إلى تساقط منتشر في الشعر.</p>

    labTests: [],           // [{ id, values:{}, notes, createdAt }]
    recommendationHistory: [], // [{ id, createdAt, productIds:[] }]
    products: DEFAULT_PRODUCTS.map(p => ({...p})),
    articles: DEFAULT_ARTICLES.map(a => ({...a}))
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      products: (parsed.products && parsed.products.length) ? parsed.products : DEFAULT_PRODUCTS.map(p=>({...p})),
      articles: (parsed.articles && parsed.articles.length) ? parsed.articles : DEFAULT_ARTICLES.map(a=>({...a}))
    });
  } catch(e){
    console.error('Failed to load saved data, starting fresh.', e);
    return defaultState();
  }
}

let STATE = loadState();

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
}

function t(key, vars){
  const dict = I18N[STATE.locale] || I18N.en;
  let str = dict[key] !== undefined ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.replace('{' + k + '}', vars[k]); });
  }
  return str;
}

function isRTL(){ return STATE.locale === 'ar'; }

function localized(obj, field){
  // e.g. localized(product, 'name') -> product.nameAr if ar locale & present, else product.name
  if (isRTL()) {
    const arField = field + 'Ar';
    if (obj[arField]) return obj[arField];
  }
  return obj[field];
}

function esc(str){
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* -------------------------------- Toasts --------------------------------- */

function toast(message, kind){
  kind = kind || 'default';
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  const palette = {
    default: 'bg-slate-800/95 border-white/10 text-slate-100',
    success: 'bg-brand-900/95 border-brand-500/40 text-brand-50',
    error: 'bg-red-950/95 border-red-500/40 text-red-100'
  };
  el.className = 'toast-anim pointer-events-auto max-w-sm w-full sm:w-auto px-4 py-3 rounded-xl border shadow-glow-lg text-sm font-medium ' + (palette[kind]||palette.default);
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

/* ------------------------------ Recommendation engine --------------------- */

function computeRecommendations(){
  const profile = STATE.profile;
  const enabledProducts = STATE.products.filter(p => p.enabled !== false);
  const demo = enabledProducts.find(p => p.isDemo);
  const results = [];
  if (demo) results.push({ product: demo, reasonKey: 'reco_reason_demo' });

  if (profile && profile.conditions && profile.conditions.length){
    enabledProducts.forEach(p => {
      if (p.isDemo) return;
      const overlap = (p.conditions||[]).some(c => profile.conditions.includes(c));
      if (overlap) results.push({ product: p, reasonKey: 'reco_reason_matched', severity: profile.severity });
    });
  }
  if (results.length < 2){
    enabledProducts.forEach(p => {
      if (p.isDemo) return;
      if (results.find(r => r.product.id === p.id)) return;
      results.push({ product: p, reasonKey: 'reco_reason_general' });
    });
  }
  return results;
}

function favoriteKey(itemType, itemId){ return itemType + ':' + itemId; }
function isFavorite(itemType, itemId){
  return STATE.favorites.some(f => f.itemType === itemType && f.itemId === itemId);
}
function toggleFavorite(itemType, itemId, label){
  if (!STATE.session){ toast(t('toast_login_to_save'), 'error'); navigate('/login'); return; }
  const idx = STATE.favorites.findIndex(f => f.itemType===itemType && f.itemId===itemId);
  if (idx >= 0){
    STATE.favorites.splice(idx,1);
    toast(t('toast_removed_favorite'));
  } else {
    STATE.favorites.push({ itemType, itemId, createdAt: Date.now() });
    toast(t('toast_saved_product', { name: label || '' }), 'success');
  }
  persist();
  render();
}

}

const PROTECTED = ['/dashboard', '/favorites', '/settings', '/admin', '/onboarding'];

function render(){
  applyLocale();
  const { path, params } = getRoute();
  const app = document.getElementById('app');

  if (PROTECTED.some(p => path === p || path.startsWith(p + '/')) && !STATE.session){
    navigate('/login');
    return;
  }
  if ((path.startsWith('/admin')) && !(STATE.account && STATE.account.isAdmin)){
    app.innerHTML = pageShell(viewAdminLocked());
    window.scrollTo(0,0);
    return;
  }

  let html;
  const segs = path.split('/').filter(Boolean);

  if (path === '/' ) html = viewHome();
  else if (path === '/login') html = viewLogin();
  else if (path === '/signup') html = viewSignup();
  else if (path === '/onboarding') html = viewOnboarding();
  else if (path === '/dashboard') html = viewDashboard();
  else if (path === '/products') html = viewProducts();
  else if (segs[0] === 'products' && segs[1]) html = viewProductDetail(segs[1]);
  else if (path === '/articles') html = viewArticles();
  else if (segs[0] === 'articles' && segs[1]) html = viewArticleDetail(segs[1]);
  else if (path === '/favorites') html = viewFavorites();
  else if (path === '/lab-test') html = viewLabTest();
  else if (path === '/settings') html = viewSettings();
  else if (path === '/admin') html = viewAdmin();
  else if (path === '/admin/products') html = viewAdminProducts();
  else if (path === '/admin/articles') html = viewAdminArticles();
  else html = view404();

  app.innerHTML = pageShell(html);
  window.scrollTo(0,0);
}

/* -------------------------------- Onboarding quiz ------------------------------ */

const QUIZ_STEPS = ['step_duration','step_severity','step_conditions','step_about','step_results'];

function quizProgressBar(){
  const pct = Math.round((UI.quiz.step / (QUIZ_STEPS.length-1)) * 100);
  return `
  <div class="flex items-center justify-between mb-2 text-xs font-semibold text-slate-400">
    ${QUIZ_STEPS.map((s,i) => `<span class="${i<=UI.quiz.step ? 'text-brand-300' : ''}">${t(s)}</span>`).join('')}
  </div>
  <div class="h-1.5 rounded-full bg-white/10 overflow-hidden">
    <div class="h-full bg-gradient-to-r from-brand-500 to-brand-300 transition-all duration-300" style="width:${pct}%"></div>
  </div>`;
}

function choiceCard(selected, title, desc, dataAttrs){
  return `<button type="button" ${dataAttrs}
    class="w-full text-start p-4 rounded-xl border transition-all ${selected ? 'border-brand-400 bg-brand-500/15 shadow-glow' : 'border-white/10 bg-white/[0.02] hover:border-white/25'}">
    <div class="flex items-center justify-between gap-3">
      <div>
        <p class="font-semibold text-white">${title}</p>
        ${desc ? `<p class="text-xs text-slate-400 mt-0.5">${desc}</p>` : ''}
      </div>
      <span class="w-5 h-5 rounded-full border flex items-center justify-center shrink-0 ${selected ? 'bg-brand-400 border-brand-400 text-white' : 'border-white/20 text-transparent'}">${Icon.check}</span>
    </div>
  </button>`;
}

function viewOnboarding(){
  if (UI.quiz.step === undefined || UI.quiz._init !== true){
    resetQuizUI();
    UI.quiz._init = true;
  }
  const step = UI.quiz.step;

  let body = '';
  if (step === 0){
    body = `
      <h2 class="text-xl font-bold text-white mb-1">${t('quiz_q_duration')}</h2>
      <p class="text-sm text-slate-400 mb-5">${t('onboarding_intro')}</p>
      <div class="space-y-2.5">
        ${['<3','3-6','6-12','>12'].map(d => choiceCard(UI.quiz.duration===d,
          t({'<3':'duration_recent','3-6':'duration_few_months','6-12':'duration_about_year','>12':'duration_over_year'}[d]),
          '', `data-action="quiz-pick" data-field="duration" data-value="${d}"`)).join('')}
      </div>`;
  } else if (step === 1){
    body = `
      <h2 class="text-xl font-bold text-white mb-5">${t('quiz_q_severity')}</h2>
      <div class="space-y-2.5">
        ${['mild','moderate','severe'].map(s => choiceCard(UI.quiz.severity===s, t('severity_'+s), t('severity_'+s+'_desc'),
          `data-action="quiz-pick" data-field="severity" data-value="${s}"`)).join('')}
      </div>`;
  } else if (step === 2){
    body = `
      <h2 class="text-xl font-bold text-white mb-5">${t('quiz_q_conditions')}</h2>
      <div class="grid sm:grid-cols-2 gap-2.5">
        ${CONDITIONS.map(c => choiceCard(UI.quiz.conditions.includes(c.id), isRTL()?c.ar:c.en, '',
          `data-action="quiz-toggle-condition" data-value="${c.id}"`)).join('')}
      </div>`;
  } else if (step === 3){
    body = `
      <h2 class="text-xl font-bold text-white mb-5">${t('step_about')}</h2>
      <div class="grid sm:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-sm font-medium text-slate-300">${t('age')}</span>
          <input id="q-age" type="number" min="16" max="100" value="${esc(UI.quiz.age)}"
            class="mt-1.5 w-full rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-3.5 py-2.5 text-white outline-none" />
        </label>
        <label class="block">
          <span class="text-sm font-medium text-slate-300">${t('gender')}</span>
          <select id="q-gender" class="mt-1.5 w-full rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-3.5 py-2.5 text-white outline-none">
            <option value="">—</option>
            <option value="male" ${UI.quiz.gender==='male'?'selected':''}>${t('gender_male')}</option>
            <option value="female" ${UI.quiz.gender==='female'?'selected':''}>${t('gender_female')}</option>
          </select>
        </label>
        <label class="block sm:col-span-2">
          <span class="text-sm font-medium text-slate-300">${t('wilaya')}</span>
          <select id="q-wilaya" class="mt-1.5 w-full rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-3.5 py-2.5 text-white outline-none">
            <option value="">${t('select_wilaya')}</option>
            ${WILAYAS.map(w => `<option value="${w.id}" ${String(UI.quiz.wilayaId)===String(w.id)?'selected':''}>${w.id}. ${w.name}</option>`).join('')}
          </select>
        </label>
        <label class="block">
          <span class="text-sm font-medium text-slate-300">${t('lifestyle')}</span>
          <select id="q-lifestyle" class="mt-1.5 w-full rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-3.5 py-2.5 text-white outline-none">
            <option value="non_smoker" ${UI.quiz.lifestyle==='non_smoker'?'selected':''}>${t('lifestyle_non_smoker')}</option>
            <option value="smoker" ${UI.quiz.lifestyle==='smoker'?'selected':''}>${t('lifestyle_smoker')}</option>
          </select>
        </label>
        <div class="block">
          <span class="text-sm font-medium text-slate-300">${t('family_history_question')}</span>
          <div class="mt-1.5 flex gap-2">
            <button type="button" data-action="quiz-pick" data-field="familyHistory" data-value="true" class="flex-1 py-2.5 rounded-xl border font-medium ${UI.quiz.familyHistory===true?'border-brand-400 bg-brand-500/15 text-white':'border-white/10 text-slate-300'}">${t('yes')}</button>
            <button type="button" data-action="quiz-pick" data-field="familyHistory" data-value="false" class="flex-1 py-2.5 rounded-xl border font-medium ${UI.quiz.familyHistory===false?'border-brand-400 bg-brand-500/15 text-white':'border-white/10 text-slate-300'}">${t('no')}</button>
          </div>
        </div>
      </div>`;
  } else if (step === 4){
    saveProfileFromQuiz(false);
    const recos = computeRecommendations();
    body = `
      <h2 class="text-xl font-bold text-white mb-1">${t('quiz_results_title')}</h2>
      <p class="text-sm text-slate-400 mb-5">${t('quiz_results_intro')}</p>
      <div class="space-y-3">
        ${recos.length ? recos.map(r => recommendationCard(r)).join('') : `<p class="text-slate-400">${t('no_recommendations_yet')}</p>`}
      </div>
      <div class="mt-7 flex flex-col sm:flex-row gap-3">
        <button data-action="quiz-finish" class="flex-1 py-3 rounded-xl bg-brand-500 hover:bg-brand-400 text-white font-semibold shadow-glow">${t('go_to_dashboard')}</button>
        <a href="#/products" data-nav class="flex-1 text-center py-3 rounded-xl border border-white/15 text-slate-100 font-semibold">${t('browse_all_products')}</a>
      </div>`;
  }

  const nav = step < 4 ? `
    <div class="mt-7 flex items-center justify-between">
      <button data-action="quiz-back" class="px-4 py-2.5 rounded-xl text-slate-300 hover:text-white font-medium ${step===0?'invisible':''}">← ${t('back')}</button>
      <button data-action="quiz-next" class="px-6 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-400 text-white font-semibold shadow-glow flex items-center gap-2">
        ${step===3 ? t('see_results') : t('continue')} ${Icon.arrow}
      </button>
    </div>` : '';

  return `
  <section class="max-w-xl mx-auto px-4 sm:px-6 py-12 sm:py-16">
    ${quizProgressBar()}
    <div class="mt-8 animate-fade-up">
      ${body}
      ${nav}
    </div>
  </section>`;
}

function recommendationCard(r){
  const p = r.product;
  const name = localized(p, 'name');
  let reason;
  if (r.reasonKey === 'reco_reason_matched') reason = t('reco_reason_matched', { severity: t('severity_'+r.severity) });
  else reason = t(r.reasonKey);
  return `
  <div class="flex gap-4 p-4 rounded-xl border border-white/10 bg-white/[0.03]">
    <img src="${p.imageUrl || bottleSvg('#2490ED')}" alt="" class="w-16 h-16 rounded-lg object-cover shrink-0 bg-white/5" />
    <div class="min-w-0">
      <div class="flex items-center gap-2 flex-wrap">
        <a href="#/products/${p.id}" data-nav class="font-semibold text-white hover:text-brand-300">${esc(name)}</a>
        ${p.isDemo ? `<span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full bg-accent-500/20 text-accent-300">${t('demo_product_badge')}</span>` : ''}
      </div>
      <p class="text-sm text-brand-200/90 mt-0.5">${reason}</p>
      ${p.frequency ? `<p class="text-xs text-slate-500 mt-1">${esc(p.frequency)}</p>` : ''}
    </div>
  </div>`;
}

function saveProfileFromQuiz(markOnboarded){
  const q = UI.quiz;
  STATE.profile = {
    age: q.age ? Number(q.age) : null,
    gender: q.gender || null,
    wilayaId: q.wilayaId ? Number(q.wilayaId) : null,
    duration: q.duration,
    severity: q.severity,
    conditions: [...q.conditions],
    lifestyle: q.lifestyle,
    familyHistory: q.familyHistory,
    onboarded: markOnboarded ? true : (STATE.profile ? STATE.profile.onboarded : false),
    createdAt: (STATE.profile && STATE.profile.createdAt) ? STATE.profile.createdAt : Date.now(),
    updatedAt: Date.now()
  };
  const recos = computeRecommendations();
  STATE.recommendationHistory.push({ id: 'r'+Date.now(), createdAt: Date.now(), productIds: recos.map(r=>r.product.id) });
  persist();
}

function productCard(p){

  const inStock = (p.quantity||0) > 0;
  return `
  <div class="group rounded-2xl border border-white/10 bg-white/[0.03] hover:border-brand-400/30 overflow-hidden transition-all flex flex-col">
    <a href="#/products/${p.id}" data-nav class="block aspect-[4/3] bg-white/5 overflow-hidden">
      <img src="${p.imageUrl || bottleSvg('#2490ED')}" alt="${esc(name)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
    </a>
    <div class="p-4 flex flex-col flex-1">
      <div class="flex items-start justify-between gap-2">
        <a href="#/products/${p.id}" data-nav class="font-semibold text-white leading-snug hover:text-brand-300">${esc(name)}</a>
        <button data-action="toggle-fav" data-type="product" data-id="${p.id}" data-label="${esc(name)}"
          class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center border ${fav ? 'bg-accent-500/20 border-accent-400/40 text-accent-300' : 'border-white/10 text-slate-400 hover:text-white'}">
          ${Icon.heart(fav)}
        </button>
      </div>
      ${p.isDemo ? `<span class="mt-1.5 inline-block w-fit text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full bg-accent-500/20 text-accent-300">${t('demo_product_badge')}</span>` : ''}
      <p class="text-sm text-slate-400 mt-1.5 line-clamp-2">${esc(utility)}</p>
      <div class="mt-3 flex items-center justify-between">
        <span class="font-bold text-brand-200">${p.price ? p.price.toLocaleString() + ' ' + t('currency_dzd') : ''}</span>
        <span class="text-xs ${inStock ? 'text-emerald-400' : 'text-red-400'}">${inStock ? t('in_stock',{count:p.quantity}) : t('out_of_stock')}</span>
      </div>
    </div>
  </div>`;
}

function viewProducts(){
  const cats = ['all', ...new Set(STATE.products.map(p=>p.category).filter(Boolean))];
  let list = STATE.products.filter(p => p.enabled !== false);
  if (UI.productFilter.category !== 'all') list = list.filter(p => p.category === UI.productFilter.category);
  if (UI.productFilter.search){
    const q = UI.productFilter.search.toLowerCase();
    list = list.filter(p => (localized(p,'name')||'').toLowerCase().includes(q) || (localized(p,'description')||'').toLowerCase().includes(q));
  }
  return `
  <section class="max-w-6xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
    <h1 class="text-3xl font-extrabold text-white">${t('products_title')}</h1>
    <p class="text-slate-400 mt-1">${t('products_subtitle')}</p>

    <div class="mt-6 flex flex-col sm:flex-row gap-3">
      <input id="product-search" type="text" value="${esc(UI.productFilter.search)}" placeholder="${t('search_products')}"
        class="flex-1 rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-4 py-2.5 text-white placeholder:text-slate-500 outline-none" />
      <select id="product-category" class="rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-4 py-2.5 text-white outline-none">
        ${cats.map(c => `<option value="${c}" ${UI.productFilter.category===c?'selected':''}>${c==='all' ? t('all_categories') : c}</option>`).join('')}
      </select>
    </div>

    ${list.length ? `
      <div class="mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
        ${list.map(productCard).join('')}
      </div>` : `
      <div class="mt-16 text-center text-slate-400">
        <p class="font-semibold text-white">${t('no_products_yet_title')}</p>
      </div>`}
  </section>`;
}

function viewProductDetail(id){
  const p = STATE.products.find(x => x.id === id);
  if (!p){
    return `<section class="max-w-lg mx-auto px-4 py-24 text-center">

/* -------------------------------- Lab test ------------------------------------- */

function flagFor(value, low, high){
  if (value < low) return 'low';
  if (value > high) return 'high';
  return 'normal';
}

function viewLabTest(){
  const flagColor = { low:'text-amber-300 bg-amber-500/10 border-amber-400/30', normal:'text-emerald-300 bg-emerald-500/10 border-emerald-400/30', high:'text-red-300 bg-red-500/10 border-red-400/30' };

  const history = STATE.session ? [...STATE.labTests].sort((a,b)=>b.createdAt-a.createdAt) : [];

  return `
  <section class="max-w-3xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
    <h1 class="text-3xl font-extrabold text-white">${t('lab_title')}</h1>
    <p class="mt-2 text-sm text-amber-200/90 bg-amber-500/10 border border-amber-400/20 rounded-xl px-4 py-3">${t('lab_disclaimer')}</p>

    ${!STATE.session ? `
      <div class="mt-8 rounded-2xl border border-white/10 bg-white/[0.03] p-8 text-center">
        <p class="text-slate-300">${t('favorites_login_prompt')}</p>
        <a href="#/login" data-nav class="inline-block mt-4 px-5 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-400 text-white font-semibold">${t('nav_login')}</a>
      </div>` : `
    <form data-form="lab-test" class="mt-8 rounded-2xl border border-white/10 bg-white/[0.03] p-6 space-y-5">
      <p class="text-xs text-slate-500">${t('lab_leave_blank')}</p>
      <div class="grid sm:grid-cols-2 gap-4">
        ${MARKERS.map(m => `
          <label class="block">
            <span class="text-sm font-medium text-slate-300">${t('lab_marker_'+m.key)} <span class="text-slate-500 text-xs">(${m.unit})</span></span>
            <input name="${m.key}" type="number" step="0.1"
              class="mt-1.5 w-full rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-3.5 py-2.5 text-white outline-none" />
          </label>`).join('')}
      </div>
      <label class="block">
        <span class="text-sm font-medium text-slate-300">${t('lab_notes_label')}</span>
        <textarea name="notes" rows="3" placeholder="${t('lab_notes_placeholder')}"
          class="mt-1.5 w-full rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-3.5 py-2.5 text-white placeholder:text-slate-500 outline-none"></textarea>
      </label>
      <button type="submit" class="w-full py-3 rounded-xl bg-brand-500 hover:bg-brand-400 text-white font-semibold shadow-glow">${t('lab_submit')}</button>
    </form>

    ${history.length ? `
      <h2 class="mt-10 mb-4 font-bold text-white">${t('lab_results_title')}</h2>
      <div class="space-y-4">
        ${history.map(entry => `
          <div class="rounded-2xl border border-white/10 bg-white/[0.03] p-5">
            <p class="text-xs text-slate-500 mb-3">${new Date(entry.createdAt).toLocaleString(isRTL()?'ar-DZ':'en-US')}</p>
            <div class="flex flex-wrap gap-2">
              ${MARKERS.filter(m => entry.values[m.key] !== undefined && entry.values[m.key] !== null && entry.values[m.key] !== '').map(m => {
                const v = Number(entry.values[m.key]);
                const flag = flagFor(v, m.low, m.high);
                return `<span class="text-xs px-3 py-1.5 rounded-full border ${flagColor[flag]}">${t('lab_marker_'+m.key)}: ${v} ${m.unit} · ${t('lab_flag_'+flag)}</span>`;
              }).join('')}
            </div>
            ${entry.notes ? `<p class="text-sm text-slate-400 mt-3">${esc(entry.notes)}</p>` : ''}
          </div>`).join('')}
      </div>
      <p class="text-xs text-slate-500 mt-4">${t('lab_ranges_disclaimer')}</p>
    ` : `
      <div class="mt-10 text-center text-slate-400">
        <p class="font-semibold text-white">${t('no_lab_tests_yet_title')}</p>
        <p class="text-sm mt-1">${t('no_lab_tests_yet_desc')}</p>
      </div>`}
    `}
  </section>`;
}

      <textarea name="${name}" rows="3" class="mt-1.5 w-full rounded-xl bg-white/5 border border-white/10 focus:border-brand-400 px-3.5 py-2.5 text-white outline-none">${esc(value||'')}</textarea></label>`;

  return `<label class="block"><span class="text-sm font-medium text-slate-300">${label}</span>

      <div class="grid sm:grid-cols-2 gap-4">
        ${adminField(t('admin_title_en'), 'title', editing && editing.title)}
        ${adminField(t('admin_title_ar'), 'titleAr', editing && editing.titleAr)}
      </div>
      ${adminField(t('admin_summary_en'), 'summary', editing && editing.summary, 'textarea')}
      ${adminField(t('admin_summary_ar'), 'summaryAr', editing && editing.summaryAr, 'textarea')}
      ${adminField(t('admin_content_en'), 'content', editing && editing.content, 'textarea')}
      ${adminField(t('admin_content_ar'), 'contentAr', editing && editing.contentAr, 'textarea')}
      <label class="flex items-center gap-2 text-sm text-slate-300"><input type="checkbox" name="enabled" ${!editing || editing.enabled!==false ? 'checked':''} class="rounded border-white/20 bg-white/5" /> ${t('admin_enabled')}</label>
      <div class="flex gap-3">
        <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-400 text-white font-semibold">${editing ? t('admin_update') : t('admin_create')}</button>
        ${editing ? `<button type="button" data-action="admin-cancel-edit-article" class="px-5 py-2.5 rounded-xl border border-white/15 text-slate-100">${t('cancel')}</button>` : ''}
      </div>
    </form>

    <div class="mt-8 space-y-3">
      ${STATE.articles.map(a => `
        <div class="flex items-center gap-4 p-4 rounded-xl border border-white/10 bg-white/[0.03] ${a.enabled===false ? 'opacity-50' : ''}">
          <div class="w-10 h-10 rounded-lg bg-brand-500/15 text-brand-300 flex items-center justify-center shrink-0">${Icon.book}</div>
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-white truncate">${esc(a.title)}</p>
            <p class="text-xs text-slate-500">${a.slug}</p>
          </div>
          <button data-action="admin-edit-article" data-slug="${a.slug}" class="p-2 rounded-lg border border-white/10 text-slate-300 hover:text-white">${Icon.edit}</button>
          <button data-action="admin-delete-article" data-slug="${a.slug}" class="p-2 rounded-lg border border-white/10 text-red-300 hover:text-red-200">${Icon.trash}</button>
        </div>`).join('')}
    </div>
  </section>`;
}

/* ----------------------------- Global event delegation ---------------------------- */

function showFormError(msg){
  const el = document.getElementById('auth-error');
  if (el){ el.textContent = msg; el.classList.remove('hidden'); }
}

function bindGlobalEvents(){
  const app = document.getElementById('app');

  app.addEventListener('click', (e) => {
    const navEl = e.target.closest('[data-nav]');
    if (navEl){
      const mobileNav = document.getElementById('mobile-nav');
      if (mobileNav) mobileNav.classList.add('hidden');
      return; // let the hash link navigate naturally
    }

    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;

    switch(action){
      case 'toggle-mobile-nav': {
        const mn = document.getElementById('mobile-nav');
        if (mn) mn.classList.toggle('hidden');
        break;
      }
      case 'toggle-locale': {
        STATE.locale = STATE.locale === 'en' ? 'ar' : 'en';
        persist(); render();
        break;
      }
      case 'set-locale': {
        STATE.locale = el.dataset.locale;
        persist(); render();
        break;
      }
      case 'logout': {
        STATE.session = false;
        persist();
        toast(t('toast_logged_out'));
        navigate('/');
        render();
        break;
      }
      case 'toggle-fav': {
        toggleFavorite(el.dataset.type, el.dataset.id, el.dataset.label);
        break;
      }
      case 'fill-demo': {
        const form = document.querySelector('[data-form="login"]');
        if (form){
          form.querySelector('input[name="email"]').value = STATE.account ? STATE.account.email : 'demo@haircare.dz';
          form.querySelector('input[name="password"]').value = STATE.account ? STATE.account.password : 'demo1234';
        }
        break;
      }
      case 'quiz-pick': {
        const field = el.dataset.field, value = el.dataset.value;
        UI.quiz[field] = (value === 'true') ? true : (value === 'false') ? false : value;
        render();
        break;
      }
      case 'quiz-toggle-condition': {
        const v = el.dataset.value;
        const idx = UI.quiz.conditions.indexOf(v);
        if (idx >= 0) UI.quiz.conditions.splice(idx,1); else UI.quiz.conditions.push(v);
        render();
        break;
      }
      case 'quiz-back': {
        UI.quiz.step = Math.max(0, UI.quiz.step - 1);
        render();
        break;
      }
      case 'quiz-next': {
        if (UI.quiz.step === 0 && !UI.quiz.duration){ toast(isRTL()?'يرجى الاختيار للمتابعة':'Please choose an option to continue.', 'error'); break; }
        if (UI.quiz.step === 1 && !UI.quiz.severity){ toast(isRTL()?'يرجى الاختيار للمتابعة':'Please choose an option to continue.', 'error'); break; }
        UI.quiz.step = Math.min(4, UI.quiz.step + 1);
        render();
        break;
      }
      case 'quiz-finish': {
        saveProfileFromQuiz(true);
        UI.quiz._init = false;
        navigate('/dashboard');
        render();
        break;
      }
      case 'toggle-admin': {
        STATE.account.isAdmin = !STATE.account.isAdmin;
        persist(); render();
        break;
      }
      case 'delete-account': {
        if (confirm(t('confirm_delete_account'))){
          localStorage.removeItem(STORAGE_KEY);
          STATE = defaultState();
          navigate('/');
          init();
        }
        break;
      }
      case 'admin-edit-product': {
        UI.admin.productEditId = el.dataset.id;
        window.scrollTo(0,0);
        render();
        break;
      }
      case 'admin-cancel-edit-product': {
        UI.admin.productEditId = null;
        render();
        break;
      }
      case 'admin-delete-product': {
        if (confirm(t('confirm_delete_product'))){
          STATE.products = STATE.products.filter(p => p.id !== el.dataset.id);
          persist(); toast(t('toast_product_deleted')); render();
        }
        break;
      }
      case 'admin-edit-article': {
        UI.admin.articleEditId = el.dataset.slug;
        window.scrollTo(0,0);
        render();
        break;
      }
      case 'admin-cancel-edit-article': {
        UI.admin.articleEditId = null;
        render();
        break;
      }
      case 'admin-delete-article': {
        if (confirm(t('confirm_delete_article'))){
          STATE.articles = STATE.articles.filter(a => a.slug !== el.dataset.slug);
          persist(); toast(t('toast_article_deleted')); render();
        }
        break;
      }
    }
  });

  app.addEventListener('input', (e) => {
    if (e.target.id === 'product-search'){
      UI.productFilter.search = e.target.value;
      renderProductsListOnly();
    }
  });
  app.addEventListener('change', (e) => {
    if (e.target.id === 'product-category'){
      UI.productFilter.category = e.target.value;
      render();
    }
  });

  app.addEventListener('submit', (e) => {
    const form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    const type = form.dataset.form;

    if (type === 'login'){
      const fd = new FormData(form);
      const email = (fd.get('email')||'').trim();
      const password = fd.get('password')||'';
      if (STATE.account && STATE.account.email.toLowerCase() === email.toLowerCase() && STATE.account.password === password){
        STATE.session = true;
        persist();
        toast(t('welcome_back'), 'success');
        navigate(STATE.profile && STATE.profile.onboarded ? '/dashboard' : '/onboarding');
        render();
      } else {
        showFormError(t('login_failed'));
      }
    }

    else if (type === 'signup'){
      const fd = new FormData(form);
      const email = (fd.get('email')||'').trim();
      const password = fd.get('password')||'';
      if (!email || password.length < 6){ showFormError(t('signup_failed')); return; }
      STATE.account = { email, password, isAdmin: true, createdAt: Date.now() };
      STATE.session = true;
      persist();
      toast(t('welcome_back'), 'success');
      navigate('/onboarding');
      render();
    }

    else if (type === 'change-password'){
      const fd = new FormData(form);
      STATE.account.password = fd.get('password')||'';
      persist();
      toast(t('password_updated'), 'success');
      form.reset();
    }

    else if (type === 'lab-test'){
      const fd = new FormData(form);
      const values = {};
      MARKERS.forEach(m => {
        const v = fd.get(m.key);
        if (v !== '' && v !== null) values[m.key] = Number(v);
      });
      STATE.labTests.push({ id: 'lt'+Date.now(), values, notes: (fd.get('notes')||'').trim(), createdAt: Date.now() });
      persist();
      toast(t('saved'), 'success');
      form.reset();
      render();
    }

    else if (type === 'admin-product'){
      const editId = form.dataset.editId;
      const fd = new FormData(form);
      const data = {
        name: fd.get('name')||'', nameAr: fd.get('nameAr')||'',
        category: fd.get('category')||'Uncategorized',
        price: fd.get('price') ? Number(fd.get('price')) : null,
        quantity: fd.get('quantity') ? Number(fd.get('quantity')) : 0,
        frequency: fd.get('frequency')||'',
        description: fd.get('description')||'', descriptionAr: fd.get('descriptionAr')||'',
        utility: fd.get('utility')||'', utilityAr: fd.get('utilityAr')||'',
        ingredients: fd.get('ingredients')||'', ingredientsAr: fd.get('ingredientsAr')||'',
        usageInstructions: fd.get('usageInstructions')||'',
        isDemo: fd.get('isDemo') === 'on',
        enabled: fd.get('enabled') === 'on'
      };
      if (data.isDemo){
        STATE.products.forEach(p => { if (p.id !== editId) p.isDemo = false; });
      }
      if (editId){
        const idx = STATE.products.findIndex(p=>p.id===editId);
        if (idx>=0){
          STATE.products[idx] = Object.assign({}, STATE.products[idx], data, { imageUrl: STATE.products[idx].imageUrl || bottleSvg('#2490ED') });
          toast(t('toast_product_updated'), 'success');
        }
      } else {
        STATE.products.push(Object.assign({ id: 'p'+Date.now(), imageUrl: bottleSvg(['#2490ED','#f59e0b','#22d3ee','#a78bfa','#34d399'][STATE.products.length % 5]), conditions: [] }, data));
        toast(t('toast_product_created'), 'success');
      }
      UI.admin.productEditId = null;
      persist();
      navigate('/admin/products');
      render();
    }

    else if (type === 'admin-article'){
      const editSlug = form.dataset.editSlug;
      const fd = new FormData(form);
      const title = fd.get('title')||'Untitled';
      const data = {
        title, titleAr: fd.get('titleAr')||'',
        summary: fd.get('summary')||'', summaryAr: fd.get('summaryAr')||'',
        content: fd.get('content')||'', contentAr: fd.get('contentAr')||'',
        enabled: fd.get('enabled') === 'on'
      };
      if (editSlug){
        const idx = STATE.articles.findIndex(a=>a.slug===editSlug);
        if (idx>=0){
          STATE.articles[idx] = Object.assign({}, STATE.articles[idx], data);
          toast(t('toast_article_updated'), 'success');
        }
      } else {
        let slug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || ('article-'+Date.now());
        if (STATE.articles.find(a=>a.slug===slug)) slug += '-'+Date.now();
        STATE.articles.push(Object.assign({ slug }, data));
        toast(t('toast_article_created'), 'success');
      }
      UI.admin.articleEditId = null;
      persist();
      navigate('/admin/articles');
      render();
    }
  });
}

// Exposed for debugging in the browser console (e.g. window.APP.STATE).
window.APP = { get STATE(){ return STATE; }, set STATE(v){ STATE = v; }, UI, render, navigate, persist };

function renderProductsListOnly(){
  // Lightweight re-render for the products grid while typing in search,
  // so focus isn't lost on the search input itself.
  const grid = document.querySelector('#app main');
  if (!grid) { render(); return; }
  render();
  const input = document.getElementById('product-search');
  if (input){
    input.focus();
    const val = input.value;
    input.value = '';
    input.value = val;
  }
}
</script>
